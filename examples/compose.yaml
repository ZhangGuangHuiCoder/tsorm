services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local_test_only
      MYSQL_DATABASE: tsorm_test
    ports:
      - '127.0.0.1:3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 3s
      timeout: 3s
      retries: 40
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: local_test_only
      MARIADB_DATABASE: tsorm_test
    ports:
      - '127.0.0.1:3308:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 3s
      retries: 40
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: tsorm_test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tsorm_test']
      interval: 3s
      timeout: 3s
      retries: 40
